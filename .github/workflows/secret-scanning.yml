name: Secret Scanning

on:
  pull_request:
  push:
    branches: [main, pre-production]
  schedule:
    - cron: "19 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Full history and source scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Scan history and current source with redacted findings
        id: scan
        run: npm run security:secrets

      - name: Preserve redacted findings on failure
        if: failure() && steps.scan.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: redacted-secret-findings
          path: |
            .local/security/gitleaks-history.json
            .local/security/gitleaks-source.json
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: ignore
