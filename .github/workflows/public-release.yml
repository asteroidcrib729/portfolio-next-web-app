name: Public Release Verification

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: Public production URL to verify anonymously
        required: true
        type: choice
        default: https://faraz-hussain-portfolio.vercel.app
        options:
          - https://faraz-hussain-portfolio.vercel.app
  schedule:
    - cron: "11 4 * * *"
  deployment_status:

permissions:
  contents: read

concurrency:
  group: public-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-public-access:
    if: >-
      github.event_name != 'deployment_status' ||
      (github.event.deployment_status.state == 'success' &&
      (github.event.deployment.environment == 'Production' ||
      github.event.deployment.environment == 'production'))
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Verify anonymous public access
        env:
          PUBLIC_RELEASE_URL: ${{ inputs.site_url || 'https://faraz-hussain-portfolio.vercel.app' }}
        run: node scripts/verify-public-site.mjs "$PUBLIC_RELEASE_URL"
